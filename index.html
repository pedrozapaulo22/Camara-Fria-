<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisório - Câmara Fria</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .metric {
      margin: 25px 0;
    }

    .label {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .value {
      font-size: 3.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .status-badge {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .status-ok {
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .footer-info {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Câmara Fria</h1>

    <div class="metric">
      <div class="label">Temperatura Atual</div>
      <div class="value" id="tempValue">--.- °C</div>
    </div>

    <div class="metric">
      <div class="label">Rede Elétrica</div>
      <div id="statusPower" class="status-badge status-ok">Aguardando...</div>
    </div>

    <div class="footer-info" id="lastUpdate">Última atualização: --:--:--</div>
  </div>

  <script>
    const CHANNEL_ID = "3498175"; 

    function atualizarDashboard() {
      fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`)
        .then(response => response.json())
        .then(data => {
          if (!data || data === "-1") {
            console.warn("Nenhum dado retornado do ThingSpeak.");
            return;
          }

          const temp = parseFloat(data.field1).toFixed(1);
          const powerOk = (data.field2 === "1");

          document.getElementById("tempValue").innerText = `${temp} °C`;
          
          const elPower = document.getElementById("statusPower");
          if (powerOk) {
            elPower.innerText = "🟢 ENERGIA OK";
            elPower.className = "status-badge status-ok";
          } else {
            elPower.innerText = "🔴 QUEDA DE ENERGIA";
            elPower.className = "status-badge status-error";
          }

          const horaAtual = new Date().toLocaleTimeString('pt-BR');
          document.getElementById("lastUpdate").innerText = `Última atualização: ${horaAtual}`;
        })
        .catch(err => {
          console.error("Erro ao buscar dados do ThingSpeak:", err);
          document.getElementById("statusPower").innerText = "⚠️ ERRO DE CONEXÃO";
          document.getElementById("statusPower").className = "status-badge status-error";
        });
    }

    atualizarDashboard();
    setInterval(atualizarDashboard, 15000);
  </script>

</body>
</html>
