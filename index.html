<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câmara Fria</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1326;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #172238;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .section-label {
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .temp-value {
      font-size: 3.8rem;
      font-weight: bold;
      color: #00b4d8;
      margin-bottom: 35px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 35px;
    }

    .status-ok {
      background-color: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-ok {
      background-color: #10b981;
    }

    .dot-error {
      background-color: #ef4444;
    }

    .last-update {
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>CÂMARA FRIA</h1>

    <div class="section-label">TEMPERATURA ATUAL</div>
    <div class="temp-value" id="tempDisplay">--.- °C</div>

    <div class="section-label">REDE ELÉTRICA</div>
    <div id="powerBadge" class="status-badge status-ok">
      <span id="powerDot" class="dot dot-ok"></span>
      <span id="powerText">ENERGIA OK</span>
    </div>

    <div class="last-update" id="updateDisplay">Última atualização: --:--:--</div>
  </div>

  <script>
    const CHANNEL_ID = "3498175";

    function carregarDados() {
      fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`)
        .then(res => res.json())
        .then(data => {
          if (!data || data === "-1") return;

          // Atualiza Temperatura
          const temp = parseFloat(data.field1).toFixed(1);
          document.getElementById("tempDisplay").innerText = `${temp} °C`;

          // Atualiza Rede Elétrica
          const isPowerOk = (data.field2 === "1");
          const badge = document.getElementById("powerBadge");
          const dot = document.getElementById("powerDot");
          const text = document.getElementById("powerText");

          if (isPowerOk) {
            badge.className = "status-badge status-ok";
            dot.className = "dot dot-ok";
            text.innerText = "ENERGIA OK";
          } else {
            badge.className = "status-badge status-error";
            dot.className = "dot dot-error";
            text.innerText = "QUEDA DE ENERGIA";
          }

          // Atualiza Horário
          const now = new Date().toLocaleTimeString('pt-BR');
          document.getElementById("updateDisplay").innerText = `Última atualização: ${now}`;
        })
        .catch(err => console.error("Erro na atualização:", err));
    }

    // Primeira chamada e atualização a cada 15 segundos
    carregarDados();
    setInterval(carregarDados, 15000);
  </script>

</body>
</html>
