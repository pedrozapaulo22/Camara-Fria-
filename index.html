<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisório - Câmara Fria</title>
  
  <!-- Bibliotecas de Gráficos e Odômetro -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.4.0/justgage.min.js"></script>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #121212; 
      color: #ffffff; 
      margin: 0; 
      padding: 20px; 
    }
    h1 { 
      text-align: center; 
      color: #00bcd4; 
      margin-bottom: 25px; 
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
      margin-bottom: 25px; 
    }
    .card { 
      background-color: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
      text-align: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }
    .card h3 { 
      margin: 0 0 10px 0; 
      font-size: 14px; 
      color: #aaa; 
      letter-spacing: 1px; 
    }
    .value { 
      font-size: 26px; 
      font-weight: bold; 
      margin-top: 10px; 
    }
    .status-ok { color: #4caf50; }
    .status-alert { 
      color: #f44336; 
      animation: blink 1s infinite; 
    }
    
    .btn-download {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
    .btn-download:hover { 
      background-color: #008ba3; 
      color: #fff; 
    }

    .chart-container { 
      background-color: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #gaugeTemp { width: 250px; height: 170px; }

    @keyframes blink { 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <h1>Monitoramento Rei do Gelo </h1>

  <div class="grid">
    <!-- Card 1: Odômetro de Temperatura -->
    <div class="card">
      <h3>TEMPERATURA ATUAL</h3>
      <div id="gaugeTemp"></div>
    </div>

    <!-- Card 2: Status da Rede Elétrica -->
    <div class="card">
      <h3>REDE ELÉTRICA</h3>
      <div id="power" class="value">Conectando...</div>
    </div>

    <!-- Card 3: Download de Relatórios -->
    <div class="card">
      <h3>RELATÓRIOS SD</h3>
      <p style="color: #aaa; font-size: 13px;">Baixe as medições armazenadas no Cartão SD.</p>
      <button class="btn-download" onclick="baixarRelatorio()">Baixar Relatório (CSV)</button>
    </div>
  </div>

  <!-- Gráfico de Tendência -->
  <div class="chart-container">
    <canvas id="tempChart" height="90"></canvas>
  </div>

  <script>
    // =========================================================================
    // CONFIGURAÇÃO DO ENDEREÇO EXTERNO (DDNS OU IP PÚBLICO + PORTA DO ROTEADOR)
    // Altere o link abaixo para o seu endereço do No-IP / DuckDNS:
    // =========================================================================
    const ENDERECO_ARDUINO = "http://minhacamarafria.ddns.net:8080"; 

    // Ajuste automático para contornar restrições de HTTPS no GitHub Pages
    const ARDUINO_URL = window.location.protocol === "https:" 
      ? "https://corsproxy.io/?" + encodeURIComponent(ENDERECO_ARDUINO)
      : ENDERECO_ARDUINO;

    // 1. ODÔMETRO (GAUGE)
    const gauge = new JustGage({
      id: "gaugeTemp",
      value: -20, min: -25, max: 10, label: "°C",
      pointer: true,
      pointerOptions: { toplength: -15, bottomlength: 10, bottomwidth: 12, color: '#ffffff' },
      gaugeWidthScale: 0.6, counter: true, decimals: 1,
      valueFontColor: "#ffffff", labelFontColor: "#aaaaaa",
      customSectors: {
        percents: false,
        ranges: [
          { from: -25, to: -3.9, color: "#4caf50" }, // Verde (-20 a -4°C)
          { from: -3.9, to: 0.9, color: "#ffeb3b" },  // Amarelo (-3 a 0°C)
          { from: 0.9, to: 10, color: "#f44336" }     // Vermelho (> 1°C)
        ]
      }
    });

    // 2. GRÁFICO HISTÓRICO
    const ctx = document.getElementById('tempChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Temperatura (°C)',
          borderColor: '#00bcd4',
          backgroundColor: 'rgba(0, 188, 212, 0.15)',
          data: [], fill: true, tension: 0.3, borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { ticks: { color: '#888' }, grid: { color: '#333' } },
          y: { ticks: { color: '#888' }, grid: { color: '#333' } }
        },
        plugins: {
          legend: { labels: { color: '#ccc' } }
        }
      }
    });

    // 3. LEITURA DE DADOS EM TEMPO REAL
    async function fetchData() {
      try {
        const response = await fetch(ARDUINO_URL, { signal: AbortSignal.timeout(4000) });
        const data = await response.json();

        // Atualiza Odômetro
        gauge.refresh(data.temp);

        // Atualiza Status da Rede Elétrica
        const powerElem = document.getElementById('power');
        if (data.power) {
          powerElem.innerText = "ENERGIA NORMAL";
          powerElem.className = "value status-ok";
        } else {
          powerElem.innerText = "QUEDA (NA BATERIA)";
          powerElem.className = "value status-alert";
        }

        // Atualiza Gráfico
        const now = new Date().toLocaleTimeString();
        if (chart.data.labels.length > 30) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }
        chart.data.labels.push(now);
        chart.data.datasets[0].data.push(data.temp);
        chart.update();

      } catch (err) {
        console.error("Erro ao comunicar com o Arduino:", err);
        const powerElem = document.getElementById('power');
        powerElem.innerText = "Sem Conexão";
        powerElem.className = "value";
      }
    }

    // 4. DOWNLOAD DO ARQUIVO CSV
    function baixarRelatorio() {
      const downloadUrl = window.location.protocol === "https:"
        ? "https://corsproxy.io/?" + encodeURIComponent(`${ENDERECO_ARDUINO}/download`)
        : `${ENDERECO_ARDUINO}/download`;
        
      window.open(downloadUrl, '_blank');
    }

    // Atualiza os dados a cada 3 segundos
    setInterval(fetchData, 3000);
    fetchData();
  </script>
</body>
</html>
